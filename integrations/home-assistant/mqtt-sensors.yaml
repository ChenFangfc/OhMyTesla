# OhmyTesla 的 MQTT 实体（手动配置版）。
#
# 大多数人不需要这个文件：在 .env 里设 HASS_DISCOVERY=true，OhmyTesla 会
# 自动发现这些实体，一条设备级报文带出全部。这份 YAML 是给两类人的：
#   1) 关掉了自动发现、想自己掌控实体命名的
#   2) 想看看这些实体到底是什么、值域是什么的
#
# 注意：车辆本身的电量/位置/门窗等实体由 **TeslaMate v4.1.0+ 自带的**
# 自动发现提供，不在这里重复 —— 重复配置会在 HA 里出现两套一模一样的实体。

mqtt:
  sensor:
    - name: "OhmyTesla 哨兵状态"
      unique_id: ohmytesla_sentry_state
      state_topic: "ohmytesla/sentry_state"
      icon: mdi:shield-car
      # active = 当前有一个进行中的哨兵活动会话；idle = 没有

    - name: "OhmyTesla 最近告警"
      unique_id: ohmytesla_last_alert
      state_topic: "ohmytesla/last_alert"
      icon: mdi:bell-alert

    - name: "OhmyTesla 停放耗电"
      unique_id: ohmytesla_vampire
      state_topic: "ohmytesla/vampire_kwh_day"
      unit_of_measurement: kWh
      device_class: energy
      state_class: measurement
      icon: mdi:battery-minus

    - name: "OhmyTesla 待办保养"
      unique_id: ohmytesla_maintenance_due
      state_topic: "ohmytesla/maintenance_due"
      icon: mdi:wrench-clock

    - name: "OhmyTesla 睡眠评分"
      unique_id: ohmytesla_sleep_score
      state_topic: "ohmytesla/sleep_score"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:sleep
      # 该睡的时间里真正睡着的比例。低于 50% 说明有东西在让车保持清醒。

    - name: "OhmyTesla 采集覆盖率"
      unique_id: ohmytesla_logging_coverage
      state_topic: "ohmytesla/logging_coverage"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:database-check
      # 记录到的里程 ÷ 里程表跨度。低于 100% 说明有车开了没记上。

    - name: "OhmyTesla 自驾占比"
      unique_id: ohmytesla_fsd_share
      state_topic: "ohmytesla/fsd_share"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:steering

  binary_sensor:
    - name: "OhmyTesla 采集中断"
      unique_id: ohmytesla_data_stale
      state_topic: "ohmytesla/data_stale"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: problem
      icon: mdi:database-alert
      # 这一个值得单独做个自动化推给自己：采集停了的表现就是"没有告警"，
      # 而"没有告警"看起来和"一切正常"一模一样。
