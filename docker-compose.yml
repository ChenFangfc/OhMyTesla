# OhmyTesla —— 基于 TeslaMate 的特斯拉大一统自托管套件
# TeslaMate 官方镜像原封不动，OhmyTesla Hub 作为伴生服务通过 MQTT + 只读数据库集成。
services:
  teslamate:
    # 钉版本：hub 直接读 TeslaMate 的库表，上游一次 schema 迁移就可能让统计页
    # 读错列。升级时把这里和下面 grafana 的 tag 一起改，再跑一遍 ./omt up。
    image: teslamate/teslamate:4.4.0
    restart: always
    depends_on:
      - database
    environment:
      - ENCRYPTION_KEY=${TM_ENCRYPTION_KEY}
      - DATABASE_USER=${TM_DB_USER}
      - DATABASE_PASS=${TM_DB_PASS}
      - DATABASE_NAME=${TM_DB_NAME}
      - DATABASE_HOST=database
      - MQTT_HOST=mosquitto
    ports:
      # TeslaMate 自己的界面没有密码，还能一键退出登录（删掉 token、停止采集）。
      # 登录、地理围栏、车辆设置都已经在 OhmyTesla 里了，所以默认只让本机访问；
      # 确实要从别的设备打开它，在 .env 里设 TESLAMATE_BIND_ADDR=0.0.0.0。
      - "${TESLAMATE_BIND_ADDR:-127.0.0.1}:${TESLAMATE_PORT:-4000}:4000"
    volumes:
      - ./data/import:/opt/app/import
    cap_drop:
      - all

  database:
    image: postgres:18-trixie
    restart: always
    environment:
      - POSTGRES_USER=${TM_DB_USER}
      - POSTGRES_PASSWORD=${TM_DB_PASS}
      - POSTGRES_DB=${TM_DB_NAME}
    volumes:
      - teslamate-db:/var/lib/postgresql

  grafana:
    image: teslamate/grafana:4.4.0
    restart: always
    depends_on:
      - database
    environment:
      - DATABASE_USER=${TM_DB_USER}
      - DATABASE_PASS=${TM_DB_PASS}
      - DATABASE_NAME=${TM_DB_NAME}
      - DATABASE_HOST=database
      # 以前这里是 ${GF_SECURITY_ADMIN_PASSWORD:-admin}，而 .env.example 里
      # 这一项是空的 —— 出厂即 admin/admin，端口又绑在所有网卡上，而这个
      # Grafana 的数据源用的是 TeslaMate 那个 Postgres 超级用户。
      # `:?` 让 compose 在变量为空时直接报错退出，而不是悄悄退回弱口令。
      # 只在 grafana 数据卷首次初始化时生效；已跑过的装机要用 ./omt grafana-password
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env (./omt up generates one for you)}
      # 匿名访问和用户注册默认就该关死：这个面板能看到全部行车轨迹
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      # 绑定地址可配。默认保持 0.0.0.0（多数人从别的设备看面板），
      # 但想锁到本机的人不必去改 compose：在 .env 里设 BIND_ADDR=127.0.0.1。
      - "${BIND_ADDR:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - teslamate-grafana-data:/var/lib/grafana
      # 社区面板包的挂载点。teslamate/grafana 镜像里已经配好了
      # provisioning，往这个目录里丢 dashboard JSON 就会被自动加载，
      # 不需要改镜像、也不影响官方那 22 张面板的升级。
      # 我们**不往仓库里塞第三方 JSON**（各家 license 不同、还要跟着上游更新），
      # 只留口子 + 一份说明，见 grafana/community/README.md。
      - ./grafana/community:/etc/grafana/provisioning/dashboards/community:ro

  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    command: mosquitto -c /mosquitto-no-auth.conf
    # fleet-telemetry 启动时 5 秒内连不上 broker 就直接 panic 退出，
    # 所以它要等这个健康检查过了再起。
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mosquitto-conf:/mosquitto/config
      - mosquitto-data:/mosquitto/data

  ohmytesla:
    build: ./services/hub
    restart: always
    depends_on:
      - database
      - mosquitto
    # 显式 environment 列表只覆盖得到写在下面的那些键，配置里另有十几项
    # （MQTT 认证、TILE_DATUM、FLEET_REPLAY_GATE_SECONDS、FLEET_BRIDGE_* 的
    # 一整组）就永远取不到用户设的值 —— 其中 MQTT_USERNAME/PASSWORD 还是
    # 文档里列为 P0 的加固项，等于根本开不了。补一个 env_file 把 .env 整个
    # 带进来；不认识的变量 pydantic 会忽略，下面的显式项仍然优先。
    env_file:
      - .env
    environment:
      - TM_DB_HOST=database
      - TM_DB_USER=${TM_DB_USER}
      - TM_DB_PASS=${TM_DB_PASS}
      - TM_DB_NAME=${TM_DB_NAME}
      - MQTT_HOST=mosquitto
      - PUBLIC_URL=${PUBLIC_URL:-}
      - TESLACAM_ROOT=/teslacam
      - TESLACAM_TZ=${TESLACAM_TZ:-}
      # 统计按天/周/月分桶要用本地时区。不设的话按 UTC 分，
      # 东八区凌晨的行程会落到前一天、西半球晚上的会落到后一天。
      - TZ=${TZ:-}
      - DATA_DIR=/data
      - TESLAMATE_URL=http://teslamate:4000
      - GRAFANA_URL=http://grafana:3000
      - TESLAMATE_PUBLIC_PORT=${TESLAMATE_PORT:-4000}
      - TESLAMATE_BIND_ADDR=${TESLAMATE_BIND_ADDR:-127.0.0.1}
      - GRAFANA_PUBLIC_PORT=${GRAFANA_PORT:-3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TO=${SMTP_TO:-}
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - APPRISE_URLS=${APPRISE_URLS:-}
      - ALERT_QUIET_HOURS=${ALERT_QUIET_HOURS:-}
      - ALERT_COOLDOWN_SECONDS=${ALERT_COOLDOWN_SECONDS:-300}
      - ALERT_LANG=${ALERT_LANG:-zh}
      - OHMYTESLA_PASSWORD=${OHMYTESLA_PASSWORD:-}
      - TILE_URL=${TILE_URL:-}
      - FLEET_TOPIC_PREFIX=${FLEET_TOPIC_PREFIX:-telemetry}
      - SENTRY_DEDUP_SECONDS=${SENTRY_DEDUP_SECONDS:-15}
      - SENTRY_ESCALATE_SECONDS=${SENTRY_ESCALATE_SECONDS:-90}
      - SENTRY_POLLED_ALERTS=${SENTRY_POLLED_ALERTS:-true}
      - DATA_STALE_SECONDS=${DATA_STALE_SECONDS:-1800}
      - FLEET_BRIDGE_ENABLED=${FLEET_BRIDGE_ENABLED:-false}
      - FLEET_BRIDGE_PROVIDER=${FLEET_BRIDGE_PROVIDER:-teslemetry}
      - FLEET_BRIDGE_TOKEN=${FLEET_BRIDGE_TOKEN:-}
      - FLEET_BRIDGE_URL=${FLEET_BRIDGE_URL:-}
      - FLEET_BRIDGE_TRANSPORT=${FLEET_BRIDGE_TRANSPORT:-}
      - FLEET_BRIDGE_VINS=${FLEET_BRIDGE_VINS:-}
      # 与 TeslaMate 同一个密钥 —— 让 hub 能自动复用其 Tesla token 下发车辆指令
      - ENCRYPTION_KEY=${TM_ENCRYPTION_KEY}
      - TESLA_API_HOST=${TESLA_API_HOST:-https://owner-api.teslamotors.com}
      - TESLA_ACCESS_TOKEN=${TESLA_ACCESS_TOKEN:-}
      - COST_WRITE_BACK=${COST_WRITE_BACK:-false}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${OHMYTESLA_PORT:-8800}:8800"
    volumes:
      - ${TESLACAM_DIR:-./data/teslacam}:/teslacam
      - ./data/hub:/data

  # 车辆指令不再需要单独的签名代理容器：hub 内置了签名（tesla-fleet-api），
  # 在网页「设置 → 车辆指令」里一步步配好开发者应用和虚拟钥匙即可。

  # 可选: 官方 Fleet Telemetry 自托管（哨兵 Aware/Panic 真实事件流）
  # 需要 Tesla 开发者账号 + 公网域名 + mTLS 证书，配置见 docs/FLEET-TELEMETRY.md
  # 启用: docker compose --profile fleet up -d
  fleet-telemetry:
    # latest 落后于上游 HEAD，钉住已发布的版本，升级时手动改
    image: tesla/fleet-telemetry:v0.9.5
    profiles: ["fleet"]
    restart: always
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      # 公网上扫端口的 TLS 握手失败会刷满日志
      - SUPPRESS_TLS_HANDSHAKE_ERROR_LOGGING=true
    ports:
      - "4443:4443"
    volumes:
      - ./config/fleet-telemetry.json:/etc/fleet-telemetry/config.json:ro
      - ./config/certs:/etc/fleet-telemetry/certs:ro

volumes:
  teslamate-db:
  teslamate-grafana-data:
  mosquitto-conf:
  mosquitto-data:
