{% extends "shell.html" %}
{% block title %}{{ t('nav.controls', 'Controls') }} · OhmyTesla{% endblock %}

{% block content %}
<div class="page">
  <div class="row" style="align-items:flex-end;gap:16px;margin-bottom:18px">
    <div>
      <div class="eyebrow" id="c-eyebrow">&nbsp;</div>
      <h1 class="display-md" data-i18n="nav.controls">Controls</h1>
      <div class="body-sm" id="c-fresh" style="margin-top:6px">&nbsp;</div>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="c-refresh"><span class="ico-slot" data-icon="refresh" data-size="16"></span><span data-i18n="controls.refresh">Refresh</span></button>
    <button class="btn accent" id="c-wake" hidden><span class="ico-slot" data-icon="power" data-size="16"></span><span data-i18n="controls.wake">Wake</span></button>
  </div>

  <div class="setup-banner" id="setup" hidden>
    <span class="ico-slot" data-icon="key" data-size="22"></span>
    <div class="txt"></div>
    <a class="btn accent" href="/settings#commands" data-i18n="home.setup.cta">Set up</a>
  </div>

  <div class="ctl-grid" id="grid"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/pages/controls.js"></script>
{% endblock %}
