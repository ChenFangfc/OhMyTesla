{# Settings v2: vehicle commands (Fleet API key + sign-in + pairing) and
   Sentry behaviour (home, fast check, location policies). Rendered by
   static/js/pages/settings2.js. #}

<details class="disclose" id="commands">
  <summary><span data-i18n="fleet.heading">Vehicle commands</span><span class="value" id="v-commands"></span><span class="chev ico-slot" data-icon="chevron" data-size="16"></span>
  </summary>
  <div class="body">
    <p class="body-sm" style="margin:0 0 18px;max-width:66ch" data-i18n-html="fleet.intro"></p>
    <ol class="steps" id="fleet-steps"></ol>
  </div>
</details>

<details class="disclose" id="sentry">
  <summary><span data-i18n="sentrycfg.heading">Sentry alerts</span><span class="value" id="v-sentry"></span><span class="chev ico-slot" data-icon="chevron" data-size="16"></span>
  </summary>
  <div class="body" id="sentry-body"></div>
</details>

<style>
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  .steps > li { position: relative; padding: 0 0 22px 46px; counter-increment: step; }
  .steps > li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--bg-hover); color: var(--text-secondary); }
  .steps > li.done::before { content: "✓"; background: var(--green-soft); color: var(--green); }
  .steps > li::after { content: ""; position: absolute; left: 14.5px; top: 34px; bottom: 4px; width: 1px; background: var(--line); }
  .steps > li:last-child::after { display: none; }
  .steps h4 { font-size: 15px; font-weight: 550; margin: 4px 0 6px; }
  .steps .hint { font-size: 13px; color: var(--text-tertiary); line-height: 1.55; max-width: 64ch; }
  .steps code, .ch code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--bg-hover); padding: 2px 6px; border-radius: 6px; word-break: break-all; }
  .form-grid { display: grid; grid-template-columns: 150px 1fr; gap: 10px 14px; align-items: center; max-width: 620px; margin-top: 10px; }
  .form-grid label { font-size: 13px; color: var(--text-secondary); }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  .okmsg { color: var(--green); font-size: 13px; } .errmsg { color: var(--red); font-size: 13px; }
  .qr { display: inline-block; padding: 10px; background: #fff; border-radius: 12px; line-height: 0; }
  .qr svg, .qr img { width: 148px; height: 148px; }
  .ch { border-top: 1px solid var(--line); padding: 14px 0; }
  .ch:first-child { border-top: 0; padding-top: 0; }
  .ch-head { display: flex; align-items: center; gap: 10px; }
  .ch-head .nm { font-weight: 550; }
  .ch-head .st { font-size: 12.5px; color: var(--text-tertiary); }
  .ch-head .st.ok { color: var(--green); } .ch-head .st.warn { color: var(--amber); }
  .ch-head .sp { flex: 1; }
  .ch-form { margin-top: 12px; }
</style>
